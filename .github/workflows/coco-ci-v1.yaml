# =====================================================================================
# fsap-microservice-ci-v1.yaml  (DỰ ĐOÁN / RECONSTRUCTION - phiên bản đã tối ưu)
# Reusable workflow tối giản cho microservice Java/Gradle:
#   1. Build & Unit Test
#   2. Build image bằng Jib & push lên ECR
#   3. Cập nhật image tag vào gitops-manifests (GitOps repo) để ArgoCD tự sync
#
# LƯU Ý: bản dựng lại dựa trên các input mà workflow gọi vào, không phải file gốc.
# =====================================================================================

name: COCO Microservice CI v1

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      owner:
        required: true
        type: string
      build_with_jib:
        required: false
        type: boolean
        default: true
      environment:
        required: true
        type: string
    secrets:
      GITOPS_REPO_TOKEN:
        required: false   # PAT/deploy key có quyền write vào repo gitops-manifests

env:
  AWS_ENDPOINT_URL: http://localhost:4566   # tên container Floci đang chạy sẵn
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

  ECR_REPO_URI: ${{ inputs.registry }}/${{ inputs.image_name }}

jobs:

  # ---------------------------------------------------------------------------------
  # 1. BUILD & UNIT TEST
  # ---------------------------------------------------------------------------------
  build-and-test:
    name: Build & Unit Test
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/test-results/test/*.xml"

  # ---------------------------------------------------------------------------------
  # 2. BUILD IMAGE (Jib) & PUSH LÊN ECR — chỉ chạy khi push vào main
  #    Tag image dạng <branch>-<short-sha> để dễ đối chiếu trên ArgoCD UI
  # ---------------------------------------------------------------------------------
  build-and-push-image:
    name: Build Image with Jib & Push to ECR
    if: ${{ github.event_name == 'push' }}
    needs: build-and-test
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.compute-tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Compute image tag (branch-sha)
        id: compute-tag
        run: |
          # thay "/" trong tên nhánh bằng "-" vì Docker tag không cho phép "/"
          BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "image_tag=${BRANCH_NAME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login vào Floci ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin \
          ${{ inputs.registry }}

      - name: Build & Push image via Jib
        env:
          IMAGE_TAG: ${{ steps.compute-tag.outputs.image_tag }}
        run: |
          ./gradlew jib \
            -Djib.to.image=${{ env.ECR_REPO_URI }}:${{ env.IMAGE_TAG }} \
            -Djib.allowInsecureRegistries=true \
            --no-daemon

  # ---------------------------------------------------------------------------------
  # 3. CẬP NHẬT GITOPS-MANIFESTS (ArgoCD tự phát hiện & sync vào EKS)
  # ---------------------------------------------------------------------------------
  update-gitops-manifest:
    name: Update Helm values (GitOps repo) for ${{ inputs.environment }}
    if: ${{ github.event_name == 'push' }}
    needs: build-and-push-image
    runs-on: self-hosted
    env:
      IMAGE_TAG: ${{ needs.build-and-push-image.outputs.image_tag }}
    steps:
      - name: Checkout GitOps repo (chứa Helm chart / values)
        uses: actions/checkout@v4
        with:
          repository: CoCoCoffeeCode/gitops-manifests
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Install yq
        run: command -v yq >/dev/null 2>&1 || arch -arm64 brew install yq

      - name: Bump image tag + push với retry
        working-directory: gitops
        run: |
          VALUES_FILE="apps/${{ inputs.image_name }}/${{ inputs.environment }}/values.yaml"
          git config user.name "coco-ci-bot"
          git config user.email "ci-bot@coco.vn"
          
          push_success=false
          for i in 1 2 3 4 5; do
            yq -i '.image.repository = "'"${{ env.ECR_REPO_URI }}"'"' "$VALUES_FILE"
            yq -i '.image.tag = "'"${{ env.IMAGE_TAG }}"'"' "$VALUES_FILE"
            git add "$VALUES_FILE"
            git commit -m "chore(${{ inputs.image_name }}): deploy ${{ env.IMAGE_TAG }} to ${{ inputs.environment }}" || echo "Không có thay đổi để commit, bỏ qua"

            if git push origin main; then
              echo "Push thành công"
              push_success=true
              break
            fi

            echo "Push bị reject (có commit khác chen vào) — pull rebase và thử lại (lần $i)"
            git fetch origin main
            git reset --hard origin/main
            sleep $((RANDOM % 5 + 1))
          done
          
          if [ "$push_success" = false ]; then
            echo "::error::Push vào gitops-manifests thất bại sau 5 lần thử"
            exit 1
          fi
