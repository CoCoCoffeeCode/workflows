# =====================================================================================
# fsap-microservice-ci-v1.yaml  (DỰ ĐOÁN / RECONSTRUCTION - phiên bản đã tối ưu)
# Reusable workflow tối giản cho microservice Java/Gradle:
#   1. Build & Unit Test
#   2. Build image bằng Jib & push lên ECR
#   3. Cập nhật image tag vào gitops-manifests (GitOps repo) để ArgoCD tự sync
#
# LƯU Ý: bản dựng lại dựa trên các input mà workflow gọi vào, không phải file gốc.
# =====================================================================================

name: COCO Microservice CI v1

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      owner:
        required: true
        type: string
      build_with_jib:
        required: false
        type: boolean
        default: true
      environment:
        required: true
        type: string
    secrets:
      GITOPS_REPO_TOKEN:
        required: false   # PAT/deploy key có quyền write vào repo gitops-manifests

env:
  AWS_ENDPOINT_URL: http://localhost:4566   # tên container Floci đang chạy sẵn
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

  IMAGE_TAG: ${{ github.sha }}
  ECR_REPO_URI: ${{ inputs.registry }}/${{ inputs.image_name }}

jobs:

  # ---------------------------------------------------------------------------------
  # 1. BUILD & UNIT TEST
  # ---------------------------------------------------------------------------------
  build-and-test:
    name: Build & Unit Test
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/test-results/test/*.xml"

  # ---------------------------------------------------------------------------------
  # 2. BUILD IMAGE (Jib) & PUSH LÊN ECR — chỉ chạy khi push vào main
  # ---------------------------------------------------------------------------------
  build-and-push-image:
    name: Build Image with Jib & Push to ECR
    if: ${{ github.event_name == 'push' }}
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Login vào Floci ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin \
          ${{ inputs.registry }}

      - name: Build & Push image via Jib
        run: |
          ./gradlew jib \
            -Djib.to.image=${{ env.ECR_REPO_URI }}:${{ env.IMAGE_TAG }} \
            -Djib.allowInsecureRegistries=true \
            --no-daemon

